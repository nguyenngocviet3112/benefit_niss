# ============================================================================
# SonarQube -- análise do código-fonte / phân tích mã nguồn
# ----------------------------------------------------------------------------
# Cobre o frontend Angular (TypeScript/HTML/CSS) e os scripts SQL.
# O backend C# NÃO é analisado por este ficheiro: C# exige o SonarScanner for
# .NET, que corre em conjunto com o build (ver instruções em baixo).
#
# [VI] File này quét frontend Angular (TypeScript/HTML/CSS) và các script SQL.
# Backend C# KHÔNG quét bằng file này: C# bắt buộc dùng SonarScanner for .NET,
# chạy kèm quá trình build (xem hướng dẫn ở cuối file).
# ============================================================================

sonar.projectKey=inss-contrib-finance
sonar.projectName=INSS Contribuicoes & Financas
sonar.sourceEncoding=UTF-8

# Apenas código-fonte escrito à mão. / Chỉ lấy mã nguồn viết tay.
sonar.sources=financial/TimorINSS-MInterno/src,contribution/ModuloContribuicoes/src,db-migrations

# ----------------------------------------------------------------------------
# Exclusões -- decisivas neste repositório.
# O repo versiona artefactos de build (dist/ com JS minificado, bin/, obj/) e
# tem node_modules/. Sem estas exclusões a análise devolve dezenas de milhares
# de problemas em ficheiros gerados e o resultado fica inútil.
#
# [VI] Phần loại trừ -- rất quan trọng với repo này. Repo có commit cả artefact
# build (dist/ chứa JS đã minify, bin/, obj/) và có node_modules/. Không loại trừ
# thì kết quả sẽ toàn lỗi trong file sinh tự động, đọc vô nghĩa.
# ----------------------------------------------------------------------------
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/*.min.js,**/*.min.css,**/assets/i18n/**,**/environments/environment*.ts,**/polyfills.ts,**/*.spec.ts

# Ficheiros de teste (o projecto praticamente não tem testes escritos).
# [VI] File test (dự án gần như không có test thật).
sonar.test.inclusions=**/*.spec.ts

# ----------------------------------------------------------------------------
# O analisador de JS/TS percorre a árvore de directórios a partir da raiz do
# projecto, independentemente de sonar.sources, à procura de tsconfig/package.json.
# Sem estas exclusões entra em backend/**/bin/Release/... e rebenta com ENOENT.
# [VI] Bộ phân tích JS/TS duyệt toàn bộ cây thư mục từ gốc project, không phụ
# thuộc sonar.sources, để tìm tsconfig/package.json. Không loại trừ thì nó chui
# vào backend/**/bin/Release/... và chết với lỗi ENOENT.
# ----------------------------------------------------------------------------
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,backend/**
sonar.typescript.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,backend/**
