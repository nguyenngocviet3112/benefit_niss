<div class="lc-container">
  <div class="lc-header">
    <h2>{{ 'idiomaConfig.header' | translate }} <span class="en">({{ 'idiomaConfig.headerGloss' | translate }})</span></h2>
    <p class="lc-hint">{{ 'idiomaConfig.hint' | translate }}</p>
  </div>

  <div class="lc-list" *ngIf="!loading">
    <div class="lc-row" *ngFor="let lang of languages">
      <span class="lc-codigo">{{ lang.codigo }}</span>
      <span class="lc-nome">{{ lang.nome }}</span>
      <span class="lc-status" [class.inactive]="!lang.indActivo">
        {{ (lang.indActivo ? 'idiomaConfig.enabled' : 'idiomaConfig.disabled') | translate }}
      </span>
      <button mat-stroked-button (click)="toggle(lang)">
        {{ (lang.indActivo ? 'idiomaConfig.disableButton' : 'idiomaConfig.enableButton') | translate }}
      </button>
    </div>
    <div class="lc-empty" *ngIf="languages.length === 0">{{ 'idiomaConfig.emptyList' | translate }}</div>
  </div>
</div>
