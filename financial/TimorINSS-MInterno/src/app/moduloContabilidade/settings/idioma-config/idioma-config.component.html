<div class="lc-container">
  <div class="lc-header">
    <h2>Cấu hình ngôn ngữ <span class="en">(Language / i18n config)</span></h2>
    <p class="lc-hint">Bật/tắt ngôn ngữ hiển thị trong dropdown chọn ngôn ngữ (mode mới). Phải giữ lại ít nhất 1 ngôn ngữ đang bật.</p>
  </div>

  <div class="lc-list" *ngIf="!loading">
    <div class="lc-row" *ngFor="let lang of languages">
      <span class="lc-codigo">{{ lang.codigo }}</span>
      <span class="lc-nome">{{ lang.nome }}</span>
      <span class="lc-status" [class.inactive]="!lang.indActivo">
        {{ lang.indActivo ? 'Đang bật' : 'Đang tắt' }}
      </span>
      <button mat-stroked-button (click)="toggle(lang)">
        {{ lang.indActivo ? 'Tắt' : 'Bật' }}
      </button>
    </div>
    <div class="lc-empty" *ngIf="languages.length === 0">Chưa có dữ liệu.</div>
  </div>
</div>
