<div class="ep-container">
  <div class="ep-header">
    <h2>Estrutura Programática <span class="en">(Cơ cấu Chương trình ngân sách)</span></h2>
  </div>

  <div class="ep-context-bar">
    <mat-form-field appearance="outline" class="small-field">
      <mat-label>Kỳ ngân sách (Ano)</mat-label>
      <input matInput type="number" [(ngModel)]="orcamentoConfigFk" name="orcamentoConfigFk" />
    </mat-form-field>
    <button mat-stroked-button (click)="loadTree()">Tải lại</button>

    <span class="spacer"></span>

    <mat-form-field appearance="outline" class="small-field">
      <mat-label>Sao chép sang kỳ</mat-label>
      <input matInput type="number" [(ngModel)]="copyTargetOrcamentoConfigFk" name="copyTarget" />
    </mat-form-field>
    <button mat-stroked-button (click)="copyFromCurrentYear()">⧉ Sao chép từ kỳ này</button>

    <app-master-data-import-button entityPath="programactivity" [orcamentoConfigFk]="orcamentoConfigFk" (imported)="loadTree()"></app-master-data-import-button>
    <button mat-raised-button color="primary" (click)="openAddForm()">+ Thêm Programa</button>
  </div>

  <div class="ep-tree" *ngIf="!loading">
    <ng-container *ngFor="let root of tree">
      <ng-container *ngTemplateOutlet="nodeTemplate; context: { node: root }"></ng-container>
    </ng-container>
    <div class="ep-empty" *ngIf="tree.length === 0">Chưa có dữ liệu cho kỳ ngân sách này.</div>
  </div>

  <ng-template #nodeTemplate let-node="node">
    <div class="ep-row" [ngClass]="'lvl' + node.nivel">
      <span class="ep-code">{{ node.codigo }}</span>
      <span class="ep-desig">{{ node.designacao }}</span>
      <span class="ep-actions">
        <button mat-button *ngIf="node.nivel < 3" (click)="openAddForm(node)">+ Con</button>
        <button mat-button (click)="openEditForm(node)">Sửa</button>
        <button mat-button (click)="deactivate(node)">Xóa</button>
      </span>
    </div>
    <ng-container *ngFor="let child of node.children">
      <ng-container *ngTemplateOutlet="nodeTemplate; context: { node: child }"></ng-container>
    </ng-container>
  </ng-template>

  <div class="ep-form-overlay" *ngIf="showForm">
    <div class="ep-form">
      <h3>{{ editingId ? 'Sửa' : 'Thêm' }} — Cấp {{ formNivel }}</h3>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mã (Código)</mat-label>
        <input matInput [(ngModel)]="formCodigo" name="formCodigo" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tên gọi (Designação)</mat-label>
        <input matInput [(ngModel)]="formDesignacao" name="formDesignacao" />
      </mat-form-field>

      <div class="ep-form-actions">
        <button mat-button (click)="cancelForm()">Hủy</button>
        <button mat-raised-button color="primary" (click)="save()">Lưu</button>
      </div>
    </div>
  </div>
</div>
