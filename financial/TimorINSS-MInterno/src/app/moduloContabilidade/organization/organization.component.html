<div class="org-container">
  <div class="org-header">
    <h2>Organization <span class="en">(Tổ chức — INSS / FRSS)</span></h2>
  </div>

  <div class="org-list" *ngIf="!loading">
    <div class="org-row" *ngFor="let inst of institutions">
      <span class="org-nome">{{ inst.nome }}</span>
      <span class="org-status" [class.inactive]="!inst.indActivo">
        {{ inst.indActivo ? 'Ativo' : 'Inativo' }}
      </span>
    </div>
    <div class="org-empty" *ngIf="institutions.length === 0">
      Chưa có dữ liệu — cần chạy script seed (db_migrations/2026-07-11_m1_master_data.sql).
    </div>
  </div>
</div>
